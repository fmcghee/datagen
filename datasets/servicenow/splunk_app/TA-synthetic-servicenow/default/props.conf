# Install this app on the search head for search-time JSON extraction.
# If you choose index-time JSON extraction instead, use INDEXED_EXTRACTIONS=json
# on the parsing tier and set KV_MODE=none on search heads to avoid duplicate fields.

[snow:incident]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "_time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TRUNCATE = 0
NO_BINARY_CHECK = true
category = Structured
pulldown_type = true

