action.email = 0
action.email.enable_alert = 0
alert.suppress = 0
cron_schedule = 0 6 * * *
description = ES 8.5 template SPL for SOC 1 Mission Control findings. Copy into Security content as an event-based detection with Output Create findings.
disabled = 1
dispatch.earliest_time = -7d
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
