[demo_validate_servicenow_incidents]
action.email = 0
action.email.enable_alert = 0
alert.suppress = 0
cron_schedule = 0 6 * * *
description = Validate synthetic ServiceNow incidents were indexed.
disabled = 1
dispatch.earliest_time = -7d
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.page.search.tab = statistics
enableSched = 0
is_scheduled = 0
request.ui_dispatch_app = demo_servicenow_es
search = index=demo_servicenow sourcetype=demo:snow:incident | stats count values(number) AS sample_incidents BY state priority

[demo_validate_es_incident_source]
action.email = 0
action.email.enable_alert = 0
alert.suppress = 0
cron_schedule = 0 6 * * *
description = Validate ES/Mission Control source rows were indexed.
disabled = 1
dispatch.earliest_time = -7d
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.page.search.tab = statistics
enableSched = 0
is_scheduled = 0
request.ui_dispatch_app = demo_servicenow_es
search = index=demo_security sourcetype=demo:es:incident | stats count values(snow_incident_number) AS linked_inc values(notable_id) AS notable_ids BY soc_queue status_name urgency

[demo_es85_detection_soc1_template]
action.email = 0
action.email.enable_alert = 0
alert.suppress = 0
cron_schedule = 0 6 * * *
description = ES 8.5 template SPL for SOC 1 Mission Control findings. Copy into Security content as an event-based detection with Output Create findings.
disabled = 1
dispatch.earliest_time = -7d
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.page.search.tab = statistics
enableSched = 0
is_scheduled = 0
request.ui_dispatch_app = demo_servicenow_es
search = index=demo_security sourcetype=demo:es:incident soc_queue="SOC 1 Queue" | table _time name description snow_incident_number service_now_incident notable_id soc_queue status_name urgency severity assignee owner risk_object cmdb_ci business_service correlation_search mitre_tactic mitre_technique

