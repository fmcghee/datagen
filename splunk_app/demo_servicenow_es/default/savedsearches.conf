[demo_validate_mc_linkage]
action.email = 0
action.email.enable_alert = 0
alert.suppress = 0
cron_schedule = 0 6 * * *
description = Validate Mission Control findings link to ServiceNow INCs via notable_id and snow_incident_number.
disabled = 1
dispatch.earliest_time = -30d
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.page.search.tab = statistics
enableSched = 0
is_scheduled = 0
request.ui_dispatch_app = demo_servicenow_es
search = index=demo_security sourcetype=demo:es:incident | eval service_now_inc=snow_incident_number | table _time soc_queue notable_id service_now_inc name status_name | join type=left notable_id [ search index=notable | search rule_name="*Mission Control*" OR rule_name="*SOC*" OR title="INC*" | eval mc_title=coalesce(title, rule_name) | table notable_id mc_title rule_name status ] | join type=left service_now_inc [ search index=demo_servicenow sourcetype=demo:snow:incident | table number state priority u_splunk_notable_event_id | rename number AS service_now_inc ] | eval linkage=case(isnotnull(mc_title) AND isnotnull(state), "Mission Control + ServiceNow", isnotnull(mc_title), "Mission Control only", isnotnull(state), "ServiceNow only", "Unlinked") | stats count by linkage soc_queue

[demo_load_servicenow_incidents]
action.email = 0
action.email.enable_alert = 0
alert.suppress = 0
cron_schedule = 0 6 * * *
description = Load ServiceNow incidents from bundled lookup into index=demo_servicenow. Open this search and click Run (green arrow). Run once only.
disabled = 1
dispatch.earliest_time = -1s
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.page.search.tab = statistics
enableSched = 0
is_scheduled = 0
request.ui_dispatch_app = demo_servicenow_es
search = | inputlookup servicenow_incidents_demo | eval _time=coalesce(strptime(opened_at,"%Y-%m-%d %H:%M:%S"), strptime(sys_updated_on,"%Y-%m-%d %H:%M:%S"), now()) | collect index=demo_servicenow sourcetype=demo:snow:incident addtime=false marker=0

