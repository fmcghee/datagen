# Search-time JSON field extraction for bundled demo CSV events.

[demo:snow:incident]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "_time"\s*:\s*
TIME_FORMAT = %s
TRUNCATE = 0
NO_BINARY_CHECK = true
category = Structured
pulldown_type = true

